# ZEKA kopru servisi -- `podman compose` ile kaldirilir.
#
# PORT ACILMAZ. Servis backend'in QUIC'ine dial-out eder (`ai/protocol.rs:3-7`);
# NAT ardinda yasayabilsin ve backend tek otorite kalsin diye.
services:
  bridge:
    build:
      context: .
      dockerfile: Containerfile
    # HEZARFEN_TAG deploy tarafindan yazilan stack.env'den gelir: unit ve deploy
    # tek `--env-file stack.env` verir, operator sirlari ise ORTAMDAN gelir
    # (systemd `EnvironmentFile=` / deploy'un surece almasi) -- bu
    # saglayicida `--env-file` yalniz SON dosyayi cozer, iki dosyali cagri
    # operator dosyasini dusurur (podman_compose.py:2941-2946, :2559).
    # Yerelde/elle `up` icin varsayilan `current`:
    # yani `podman compose up -d --build` yine calisiyor. Sabit bir `:current`
    # yazilsaydi deploy yeni imaji yukleyip ESKI imaji kosmaya devam ederdi --
    # tag rotasyonu ve geri donus (previous_tag) bu satira baglidir.
    image: localhost/hezarfen-zeka:${HEZARFEN_TAG:-current}
    container_name: hezarfen_zeka
    init: true
    command: ["python", "-m", "src.bridge"]
    environment:
      # --- kopru adresi ---
      AI_BRIDGE_HOST: ${AI_BRIDGE_HOST:-hezarfen_backend}
      AI_BRIDGE_PORT: ${AI_BRIDGE_PORT:-8090}
      AI_BACKEND_URL: ${AI_BACKEND_URL:-http://hezarfen_backend:7656}
      AI_TLS_SERVER_NAME: ${AI_TLS_SERVER_NAME:-localhost}
      # --- kimlik ---
      # Zorunlu. Interpolasyon kullanilir, literal sir YAZILMAZ.
      AI_SHARED_TOKEN: ${AI_SHARED_TOKEN:?AI_SHARED_TOKEN gerekli -- backend ile ayni sir olmadan kayit yapilamaz}
      AI_SERVICE_NAME: ${AI_SERVICE_NAME:-zeka}
      # --- LLM saglayicisi (segment hatti) ---
      # Zorunlu tutuluyor. DIKKAT, durust not: `src/bridge.py` bu anahtari
      # OKUMAZ; yalnizca `src/segment/config.py` okur (oradaki oncelik sirasi
      # LLM_API_KEY -- TEMIZ KESIM (2026-09-17): eski adlar (DEEPSEEK_API_KEY,
      # SEGMENT_API_KEY, SEGMENT_BASE_URL, SEGMENT_MODEL_*) KALDIRILDI; dolu
      # bulunurlarsa yapilandirma acilista reddedilir). Yani anahtarsiz
      # bir kopru teknik olarak ayaga kalkardi, segment hatti kosulunca
      # patlardi. `:?` ile hatayi DAGITIM anina cekiyoruz: acilista bir satir
      # hata, uretimde saatler sonra sasirtici bir cokme yerine.
      # Sir DOSYAYA GOMULMEZ: burada yalnizca interpolasyon vardir, deger
      # operatorun ortamindan ya da `--env-file` ile verilen (gitignore'lu)
      # `.env` dosyasindan gelir.
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY gerekli -- segment hatti LLM saglayicisina bu anahtarla baglanir}
      # Anahtar TEK BASINA zorunludur; adres ve model kimlikleri OPSIYONELdir
      # ama operatorun dosyasindan gecmeleri GEREKIR -- baska bir kanal yok
      # (`env_file:` yok, degerler yalnizca ortamdan/`--env-file`dan gelir).
      # Adres ile anahtar birlikte anlamlidir: OpenAI uyumlu baska bir ag
      # gecidi icin LLM_BASE_URL'i ve model kimliklerini birlikte yaz.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_FLASH: ${LLM_MODEL_FLASH:-}
      LLM_MODEL_PRO: ${LLM_MODEL_PRO:-}
      LLM_MODEL_REASONER: ${LLM_MODEL_REASONER:-}
      LLM_MODEL_ROLE: ${LLM_MODEL_ROLE:-}
      # Sertifika pinleme. BOS BIRAKILIRSA TOFU: backend'in HTTP ile verdigi
      # sertifikaya sorgusuz guvenilir (podcast ve Celebi'nin bugunku hali,
      # denetimde zafiyet olarak isaretlendi). Uretimde backend'in acilista
      # logladigi SHA-256 parmak izini buraya yazin.
      AI_TLS_FINGERPRINT: ${AI_TLS_FINGERPRINT:-}
      # --- kopru davranisi ---
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-4}
      AI_RECONNECT_SECS: ${AI_RECONNECT_SECS:-3}
      AI_RECONNECT_MAX_SECS: ${AI_RECONNECT_MAX_SECS:-120}
      # --- kapsam ---
      # Okul KUTUGU artik kontrol veritabanidir (`tenants.py`): hangi
      # okullarin var oldugunu oradaki `school` tablosu soyler. Bu degisken
      # yalnizca bir FILTREdir ve BOS BIRAKILIRSA butun aktif okullar islenir.
      # `:-` bilerek: operator dosyasina `ZEKA_SCHOOLS=` yazan kisi "filtre
      # istemiyorum" demistir; burada sabit bir okul varsayilani, tam da
      # kaldirdigimiz tek-okullu kurulumu geri getirirdi.
      # Ogrenci listesi hala buradan verilir: backend'de kullanici listeleme
      # yolu yok (izin listesi `constant.rs:656-676`); bkz.
      # docs/BACKEND-GEREKSINIMLERI.md madde 3.
      ZEKA_SCHOOLS: ${ZEKA_SCHOOLS:-}
      ZEKA_STUDENT_SOURCE: ${ZEKA_STUDENT_SOURCE:-config}
      ZEKA_STUDENTS: ${ZEKA_STUDENTS:-}
      ZEKA_STUDENT_FILE: ${ZEKA_STUDENT_FILE:-}
      # --- veri cephesi ---
      ZEKA_SOURCE: ${ZEKA_SOURCE:-bridge}
      ZEKA_FIXTURE_ROOT: /data/zeka/fixtures
      ZEKA_API_TIMEOUT_SECS: ${ZEKA_API_TIMEOUT_SECS:-15}
      ZEKA_BLOB_TIMEOUT_SECS: ${ZEKA_BLOB_TIMEOUT_SECS:-60}
      # --- zamanlama ---
      ZEKA_REFRESH_INTERVAL_SECS: ${ZEKA_REFRESH_INTERVAL_SECS:-3600}
      ZEKA_REFRESH_JITTER_SECS: ${ZEKA_REFRESH_JITTER_SECS:-60}
      ZEKA_REFRESH_BATCH: ${ZEKA_REFRESH_BATCH:-25}
      # --- ZEKA'nin YAZDIGI veritabani ---
      #
      # Backend SurrealDB'den PostgreSQL'e gecti. ZEKA'nin cikti tablolari
      # (`zeka_*`) artik OKULUN KENDI veritabaninda duruyor; ayri bir ZEKA
      # veritabani yok.
      #
      # Depoyu secen TEK olcut budur: dolu ise Postgres, bos ise (asagidaki
      # eski SurrealDB degiskenleriyle) SurrealDB. Iki ayri "mod" bayragi
      # yok -- bayrakla adres ters dustugunde hangisinin kazandigi tahmin
      # isine doner (bkz. src/store_factory.py).
      #
      # `:?` ile zorunlu: adressiz bir servis ayaga kalkip hicbir sey
      # yazmadan "calisiyor" gorunurdu. Acilista bir satir hata, gunler
      # sonra bos bir tablo yerine.
      #
      # ZEKA_PG_DSN KONTROL veritabanidir: okul ciktilari BURAYA yazilmaz,
      # her okulun KENDI veritabanina yazilir. Ad okulun uuid'sinden turer
      # (`tenant.rs:112` -> "{control}_school_{uuid.simple}"), slug'dan DEGIL:
      # slug'i uuid'ye ceviren sey kontrol veritabanindaki `school` satiridir
      # ve veritabani adi DESENDEN tahmin edilmez.
      #
      # Sir DOSYAYA GOMULMEZ: burada yalnizca interpolasyon vardir.
      ZEKA_PG_DSN: ${ZEKA_PG_DSN:?ZEKA_PG_DSN gerekli -- KONTROL veritabaninin adresi; okul ciktilari okul basina ayri veritabanina yazilir}
      # Okul havuzlari SINIRLIDIR: tavan (LRU tahliye) ve bosta kalma TTL'i.
      # Bos/verilmemis deger `src/config.py` varsayilanini kullanir; havuz
      # basina BIR baglanti acilir (tavan 8 -> en fazla 8 baglanti).
      ZEKA_MAX_SCHOOL_POOLS: ${ZEKA_MAX_SCHOOL_POOLS:-8}
      ZEKA_SCHOOL_POOL_TTL_SECS: ${ZEKA_SCHOOL_POOL_TTL_SECS:-900}
      ZEKA_SCHOOL_REGISTRY_TTL_SECS: ${ZEKA_SCHOOL_REGISTRY_TTL_SECS:-30}
      ZEKA_SCHOOL_CONNECT_TIMEOUT_SECS: ${ZEKA_SCHOOL_CONNECT_TIMEOUT_SECS:-10}
      # --- (eski) SurrealDB kurulumu ---
      # ZEKA_PG_DSN verildigi surece OKUNMAZ. Gecis tamamlanana kadar duruyor.
      ZEKA_DB_HTTP_URL: ${ZEKA_DB_HTTP_URL:-}
      ZEKA_DB_NS: ${ZEKA_DB_NS:-hezarfen}
      ZEKA_DB_NAME: ${ZEKA_DB_NAME:-zeka}
      ZEKA_DB_USER: ${ZEKA_DB_USER:-}
      ZEKA_DB_PASSWORD: ${ZEKA_DB_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - zeka-fixtures:/data/zeka/fixtures
    # --- saglik kontrolu ---
    # ASIL YER BURASI: `podman build` OCI bicimi urettigi icin imajdaki
    # HEALTHCHECK satiri sessizce dusurulur (derleme uyarisi verir).
    #
    # NE KANITLAR: kopru sureci yasiyor ve zombi degil.
    # NE KANITLAMAZ: backend'e KAYITLI oldugunu. Bu kasitlidir -- backend
    # bakimdayken ZEKA'nin geri cekilerek beklemesi ariza DEGILDIR; hazir
    # olma sarti aransaydi backend'in her yeniden dagitimi ZEKA'yi
    # `unhealthy` isaretler ve restart politikasi kacinmak istedigimiz
    # crash-loop'u geri getirirdi. Ayrintisi scripts/saglik.py icinde.
    #
    # MALIYET: olculdu -- yorumlayici acilisi dahil kosu basina ~12 ms;
    # hicbir proje modulu import edilmez. (Denetimde kardes bir serviste her
    # 30 saniyede butun hatti import eden bir kontrol bulunmustu.)
    healthcheck:
      test: ["CMD", "python", "scripts/saglik.py"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - backend_net

volumes:
  zeka-fixtures:

networks:
  backend_net:
    external: true
    # PARAMETRIK: ag adi dagitimdan dagitima degisir (podcast'in deseni).
    # Kardes servisler (podcast, Celebi) de ayni deseni kullanir.
    name: ${HEZARFEN_NET:-hezarfen_backend_default}
